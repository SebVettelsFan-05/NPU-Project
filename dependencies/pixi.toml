# Pinned project toolchain (verilator, make, g++, yosys, iverilog, python).
#   set up once:  sh dependencies/setup.sh
#   use:          make regress   (config.mk picks the tools up)
# After editing a pin: dependencies/bin/pixi lock --manifest-path dependencies/pixi.toml, then re-run setup.sh

[workspace]
name = "npu-project"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
verilator = "==5.032"
make = "==4.4.1"
cxx-compiler = "*"
perl = "*"
python = ">=3.12"
numpy = "*"

# yosys / iverilog are only built for linux-64 and osx-64 on conda-forge
[target.linux-64.dependencies]
yosys = "==0.52"
iverilog = "==12.0"

[target.osx-64.dependencies]
yosys = "==0.52"
iverilog = "==12.0"
